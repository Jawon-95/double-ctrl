name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME bin/DoubleCtrl.exe --title "Double Ctrl $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file docs/RELEASE_NOTES.md
